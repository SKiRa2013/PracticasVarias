<VirtualHost *:80>
	ServerName www.gabrielalban.net
	ServerAdmin webmaster@gabrielalban.net
	DocumentRoot /var/www/galban

	<Directory /var/www/galban>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
		DirectoryIndex www.html
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/www_error.log
	CustomLog ${APACHE_LOG_DIR}/www_access.log combined
</VirtualHost>
