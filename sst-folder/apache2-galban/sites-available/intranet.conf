<VirtualHost *:80>
	ServerName gabrielalban.net
	ServerAlias intranet.gabrielalban.net
	DocumentRoot /media/skira/AcerEXT/Udenar/sst/web/public

	<Directory /media/skira/AcerEXT/Udenar/sst/web/public>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
		DirectoryIndex intranet.html
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/www_error.log
	CustomLog ${APACHE_LOG_DIR}/www_access.log combined
</VirtualHost>
