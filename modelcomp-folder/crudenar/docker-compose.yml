services:
  db:
    image: mysql:8.0
    container_name: udenar_db_container
    restart: always
    environment:
      MYSQL_DATABASE: ${database}
      MYSQL_USER: ${dbuser}
      MYSQL_PASSWORD: ${dbpass}
      MYSQL_ROOT_PASSWORD: ${rootpass} 
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backups/copia_final.sql:/docker-entrypoint-initdb.d/setup.sql

  web:
    build: .
    container_name: crud_app_container
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
